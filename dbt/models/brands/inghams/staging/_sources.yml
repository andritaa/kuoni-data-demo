    database: KUONI_DEMO
    schema: BRONZE
    description: "Inghams raw data (pilot brand — using shared BRONZE for PoC)"
    tables:
      - name: raw_bookings
        columns:
          - name: booking_id
            tests: [unique, not_null]
      - name: raw_customers
        columns:
          - name: customer_id
            tests: [unique, not_null]
      - name: raw_products
      - name: raw_destinations
